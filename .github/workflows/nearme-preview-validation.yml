name: NearMe Preview Validation

on:
  push:
    branches:
      - 'apex/nearme-runtime-*'
  pull_request:
    paths:
      - 'base44/entities/**'
      - 'base44/functions/nearme*/**'
      - 'base44/workflows/Alpha Prime Heartbeat.jsonc'
      - 'scripts/nearme-runtime-regression.mjs'
      - 'scripts/line-validation-ledger.mjs'
      - 'scripts/changed-code-validation.mjs'
      - 'scripts/server-seo-shells.mjs'
      - 'scripts/server-seo-shells.test.mjs'
      - 'vite.config.js'
      - 'vercel.json'
      - '.github/workflows/nearme-preview-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Line validation ledger
        run: node scripts/line-validation-ledger.mjs origin/main HEAD
      - name: NearMe runtime regression
        run: node scripts/nearme-runtime-regression.mjs
      - name: Existing Alpha Prime regression
        run: npm run test:alpha-prime
      - name: SEO and index eligibility contract
        run: npm run test:seo-indexing
      - name: Changed-code syntax and lint
        run: node scripts/changed-code-validation.mjs origin/main HEAD
      - name: Typecheck baseline
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Lint baseline
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verified server route shells
        run: node scripts/server-seo-shells.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nearme-line-validation-receipt
          path: line-validation-receipt.json
          if-no-files-found: warn
      - name: Release gate
        if: steps.typecheck.outcome != 'success' || steps.lint.outcome != 'success'
        run: |
          echo "RELEASE_BLOCKED_REPO_BASELINE_DEBT"
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "lint=${{ steps.lint.outcome }}"
          exit 1
